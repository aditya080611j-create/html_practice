<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex bg-black">
        <div class="left ">
            <div class="home bg-grey round m-1 p-1">
                <div class="logo invert"><img src="logo.svg" alt="logo"></div>
                <ul>
                    <li><img class="invert" src="home.svg" alt="home">Home</li>
                    <li><img class="invert" src="search.svg" alt="search">Search</li>
                </ul>
            </div>
            <div class="library bg-grey round m-1 p-1">
                <div class="heading">
                    <img class="invert" src="library.svg" alt="library">
                    <h2>
                        Your Library
                    </h2>
                </div>
                <div class="songlist">
                    <ol>
                        
                    </ol>
                </div>
                <div class="footer m-1">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
        </div>
        <div class="right bg-grey round">
            <div class="header round">
                <div class="nav">
                    <img class="invert " src="left.svg" alt="left">
                    <img class="invert " src="right.svg" alt="right">
                </div>
                <div class="buttons">
                    <button class="signbtn">sign up</button>
                    <button class="loginbtn">log in</button>
                </div>
            </div>
            <div class="spotifyplaylist">
                <h1>spotify playlist</h1>
                <div class="cardcontainer">
                    <div class="card">
                        <div class="play">
                            
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5 20V4L19 12L5 20Z" stroke="#141B34" fill="#000" stroke-width="1.5"
                                        stroke-linejoin="round" />
                                </svg>
                            </div>
                            <img src="https://i.scdn.co/image/ab67706f0000000249a1ed33d2ca64e6a5d0e550">
                            <h2>Happy hits!</h2>
                            <p>Hits to boost your mood and fill you with happiness!</p>
                        </div>
                    </div>
                    <div class="playbar">
                        <div class="seekbar">
                            <div class="circle"></div>
                        </div>
                        <div class="songinfo"></div>
                        <div class="songbuttons">
                            <img src="previous.svg" alt="">
                            <img src="play.svg" alt="">
                            <img src="next.svg" alt="">
                        </div>
                        <div class="songtime"></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
</body>

</html>
