<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="calc">
        <div class="ans"></div>
        <div class="func">
            <button class="1">1</button>
            <button class="2">2</button>
            <button class="3">3</button>
            <button class="4">4</button>
            <button class="5">5</button>
            <button class="6">6</button>
            <button class="7">7</button>
            <button class="8">8</button>
            <button class="9">9</button>
            <button class="0" style="height: 360px;">0</button>
            <button class="multiply">*</button>
            <button class="minus">-</button>
            <button class="plus">+</button>
            <button class="equal" style="height: 360px;">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
