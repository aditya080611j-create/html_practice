<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        .container{
            border: 2px solid rgb(255, 0, 0);
            display: flex;
            height: 80vh;

            /* for centering things according to main axis */
            justify-content: center;
            /* for centering things cross axis */
            align-items: center;
            /* wraping things */
            /* flex-wrap: wrap; */
            /* if you have more than one line and want that everything comes in center so use this */
            /* align-content: center; */
            /* flex-flow: row wrap; */
            /* gap: 30px; */
            row-gap: 20px;
            column-gap: 2px;

        }
        .item{
            height: 92px;
            width: 92px;
            border: 2px solid black;
            margin: 4px;
            background-color: purple;
            /* flex-grow: 1; */
        }
        .order-1{
            order: 1;
        }
        .order-2{
            order: 2;
        }
        .order-3{
            order: 3;
        }
        .item1{
            /* flex-grow: 4; */
            /* flex-shrink: 2; */
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1 ">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">10</div>

    </div>
</body>
</html>
