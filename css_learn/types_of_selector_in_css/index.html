<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>types of selector in css</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- this is ELEMENT SELECTOR -->
    <main>this is main and ELEMENT SELECTOR</main>
    <!-- this is class SELECTOR -->
    <div class="red">this is class SELECTOR</div>
    <!-- this is id SELECTOR -->
    <div id="blue">this is id SELECTOR</div>
    <!-- tis is child SELECTOR -->
     <div>
        <p>this is a child of div and also child selector</p>
     </div>
     <!-- this is descendant selector -->
     <div>
        <article>
            <h2>this is descendant selector</h2>
        </article>
     </div>
     <a target="_blank"  href="http://google.com">google</a>


</body>
</html>
