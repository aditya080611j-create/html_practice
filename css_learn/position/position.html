<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .parent{
            border:2px solid black;
            margin: 40px;
            padding: 10px;
            position: relative;
        }
        .box {
            margin: 3px;
            padding: 3px;
            border: 2px solid black;
            height: 400px;
            width: 80vw;
        }

        .box1 {
            background-color: aqua;
            position: sticky;
            top: 0px;
            z-index: 10;



        }

        .box2 {
            background-color: aquamarine;
            position: relative;
            /* z-index: 1; */
        }

        .box3 {
            background-color: bisque;
            position: fixed;
            
            bottom: 0px;
            right: 0px;


        }

        .box4 {
            background-color: blue;
            /* position: relative;
        top: 10px;
        left: 10px; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>

    </div>
</body>

</html>
