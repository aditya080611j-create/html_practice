<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
</head>
<style>
    :root{
        --color:rgb(255, 149, 0);
        --seccolor:yellow;
        --hovercolor:rgb(225, 0, 255);
    }
    * {
        margin: 0;
        padding: 0;
    }

    .nav {
        display: flex;
        margin: 14px 0px 0 30px;
    }

    .nav li {
        list-style: none;
        margin: 9px;
        padding: 15px;
        border: 2px solid black;
        border-radius: 15px;
        background-color: var(--seccolor);
    }
    .nav li:first-child{
        background-color: var(--color);
    }
    .nav li:hover{
        background-color: var(--hovercolor);
    }
</style>

<body>
    <!-- this is a  multi color navbar in css with global variables -->
    <div class="navbar">
        <ul class="nav">
            <li>home</li>
            <li>about</li>
            <li>contact us</li>
            <li>product</li>
            <li>address</li>
        </ul>
    </div>
</body>

</html>
