<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        body {
            background-color: #dce0e1;
        }

        .card {
            margin: auto;
            background-color: #ffffff;
            padding: 3px;
            border: 1px solid #c8cacb;
            height: 85vh;
            width: 26vw;
            border-radius: 13px;
        }

        .img>img {
            height: 35vh;
            width: 25vw;
            position: relative;
            top: 4px;
            left: 5px;
            border-radius: 10px;
        }

        .element1 span {
            font-size: 13px;
            margin: 4px;
            border: 1px solid #c8cacb;
            color: #8F9297;
            font-family: 'Raleway', sans-serif;
            border-radius: 30px;
            padding: 8px;
        }

        .element1 {
            position: relative;
            top: 28px;
            left: 20px;
        }

        .heading h1 {
            font-family: 'Raleway', sans-serif;
            position: relative;
            top: 53px;
            left: 16px;
            margin: 2px;
            padding: 2px;
        }

        .content p {
            font-size: 15px;
            margin: 4px;
            color: #8F9297;
            font-family: 'Raleway', sans-serif;
            width: 300px;
            text-overflow:clip;
        }

        .content {
            position: relative;
            top: 81px;
            left: 18px;
        }

        .read_more {
            margin: 2px;
            padding: 2px;
            position: relative;
            top: 130px;
            left: 148px;
        }

        #read_more {
            background-color: rgba(61, 252, 255, 0.904);
            border: none;
            font-family: 'Times New Roman', Times, serif;
            border-radius: 35px;
            color: #0000ff;
            height: 44px;
            width: 88px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="img">
            <img src="Screenshot 2026-09-19 220051.png" alt="lake view">
        </div>
        <div class="element1">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="heading">
            <h1>Lago Di Baries</h1>
        </div>
        <div class="content">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officiis temporibus officia perspiciatis illum
                odit odio cupiditate recusandae deserunt?</p>
        </div>
        <div class="read_more">
            <input type="submit" value="read more" name="read_more" id="read_more">
        </div>
    </div>
</body>

</html>
