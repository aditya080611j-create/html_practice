<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        body {
            background-color: #dce0e1;
        }

        .card {
            margin: auto;
            background-color: #ffffff;
            padding: 3px;
            border: 1px solid #c8cacb;
            height: 85vh;
            width: 30vw;
            border-radius: 13px;
        }

        .img>img {
            height: 35vh;
            width: 29vw;
            position: relative;
            top: 4px;
            left: 3px;
            border-radius: 10px;
        }

        .element1 span {
            font-size: 10px;
            margin: 2px;
            border: 1px solid #c8cacb;
            color: #8F9297;
            font-family: 'Raleway',sans-serif;

        }
    </style>
</head>

<body>
    <div class="card">
        <div class="img">
            <img src="Screenshot 2026-09-19 220051.png" alt="lake view">
        </div>
        <div class="element1">
            <span>Nature</span>
        </div>
    </div>
</body>

</html>
